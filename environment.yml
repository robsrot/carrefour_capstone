name: carrefour
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas>=2.1
  - numpy>=1.26
  - matplotlib>=3.8
  - seaborn>=0.13
  - jupyter>=1.0
  - ipykernel
  - pyarrow
  - pyyaml
  - scikit-learn>=1.3    # sklearn.cluster.HDBSCAN added in 1.3
  - scipy>=1.11          # ks_2samp for dev subset validation
  - umap-learn=0.5.6
  - plotly=5.22.0
  - pip
  - pip:
    - polars>=1.0
    - torch
    - gensim>=4.3.2
    - anthropic
    - python-dotenv
