# Dev-mode overrides — only keys that differ from base.yaml.
# Active when CARREFOUR_MODE=dev (or unset in a dev shell via $env:CARREFOUR_MODE="dev").

word2vec:
  epochs: 5      # faster iteration on dev subset

product_popularity:
  enabled: true
  max_basket_share: 0.15
  max_customer_share: 0.40
  idf_weighting: true

feature_weights:
  promo: 0.0     # first experiment: product-only segmentation
  store: 0.0     # profile store behavior after clustering, not during clustering
  kpi: 0.0       # profile KPIs after clustering, not during clustering

umap:
  cluster_dims: 50
  n_neighbors: 20
  min_dist_cluster: 0.05
  min_dist_viz: 0.1
  fit_sample: 50000

hdbscan:
  min_cluster_size: 100   # primary HDBSCAN candidate: ~15 organic tribes in product-only dev run
  min_samples: 1          # less conservative density threshold; reduces collapse into broad clusters
  cluster_method: leaf    # finer-grained density leaves, better aligned with organic tribe discovery
  fit_sample: 12000       # dev iteration: enough signal, much faster than full 44k HDBSCAN fits
  silhouette_sample: 3000

hdbscan_grid:
  min_cluster_size: [25, 50, 100, 250, 500]
  min_samples: [1, 5]
  cluster_method: [leaf]

kmeans:
  baseline_clusters: [8, 10, 12, 15, 18]

vector_source_benchmark:
  n_sample: 12000   # dev: 12k is enough signal to rank vector sources, keeps benchmark under 3 min
