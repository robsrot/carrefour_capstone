# Production overrides for the committed pipeline settings selected in dev.
# Keep the modeling recipe aligned with dev, but scale sample sizes and density
# thresholds to the larger production population.

experiments:
  enabled: false

word2vec:
  epochs: 5
  workers: 5

modeling:
  evaluation_sample_size: 50000
  fit_sample_size: 300000

profiling:
  min_term_customers: 100
  min_term_population_customers: 250
  min_subsegment_coverage: 0.005

mission_microtribes:
  min_customers: 100
  min_presented_customers: 5000

official_model_suite:
  umap_hdbscan:
    # Dev winner uses min_cluster_size=400 on the dev subset. Production fits
    # HDBSCAN on a 300k customer sample, so this keeps a similar density share.
    trial_name: u10_n75_leaf_mcs2700_scaled_soft_q95
    variant_prefix: u10_n75_leaf_mcs2700_scaled
    hdbscan:
      min_cluster_size: 2700

gmm:
  max_iter: 300
  n_init: 2

hdbscan:
  # Dev uses 150 on ~44k customers. Prod HDBSCAN fits on a 300k sample, so
  # 1000 keeps roughly the same minimum density share.
  min_cluster_size: 1000
  min_samples: 1
  cluster_selection_method: leaf

umap:
  n_components: 20
  n_neighbors: 30

autoencoder:
  epochs: 25
  batch_size: 1024
  patience: 5

pca:
  n_components: 24

kmeans:
  batch_size: 4096
