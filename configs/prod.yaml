# Production overrides for the committed pipeline settings selected in dev.
# Keep the modeling recipe aligned with dev, but scale sample sizes and density
# thresholds to the larger production population.

word2vec:
  workers: 5

modeling:
  evaluation_sample_size: 50000

profiling:
  min_term_customers: 100
  min_term_population_customers: 250
  min_subsegment_coverage: 0.005
  noise_audit_min_customers: 250

official_model_suite:
  umap_hdbscan:
    # Conservative first hard pass: keep the promoted PCA64/u20/n75/leaf
    # representation, use large stable cores, and let later passes recover
    # smaller residual groups without changing PCA/UMAP.
    trial_name: u20_n75_leaf_mcs3500_ms8_core
    variant_prefix: u20_n75_leaf_mcs3500_ms8
    umap:
      # Fit the expensive manifold step on a deterministic customer sample,
      # then transform the full production population in memory-bounded batches.
      fit_sample_size: 300000
      transform_batch_size: 50000
    hdbscan:
      min_cluster_size: 3500
      min_samples: 8
  two_stage_hdbscan:
    trial_name: two_stage_u20_n75_leaf_mcs3000_ms6_balanced_lift_core
    variant_prefix: two_stage_u20_n75_leaf_mcs3000_ms6_balanced
    second_stage_hdbscan:
      min_cluster_size: 3000
      min_samples: 6
    stage3_noise_probe:
      min_noise_customers: 1000
      hdbscan:
        min_cluster_size: 1200
  three_stage_hdbscan:
    trial_name: three_stage_u20_n75_leaf_mcs3000_ms6_balanced_lift_core
    variant_prefix: three_stage_u20_n75_leaf_mcs3000_ms6_balanced
    min_noise_customers: 1000
    third_stage_hdbscan:
      min_cluster_size: 2000
      min_samples: 6

hdbscan:
  # Prod raw-HDBSCAN diagnostics, if enabled, use a scaled minimum density share.
  min_cluster_size: 1000

pca:
  n_components: 24
